sample:
  name: Bluetooth Periodic Advertising Synchronization
tests:
  sample.bluetooth.periodic_sync:
    harness: bluetooth
    platform_allow:
      - qemu_cortex_m3
      - qemu_x86
      - nrf52_bsim
      - nrf52dk/nrf52832
    tags: bluetooth
    integration_platforms:
      - qemu_cortex_m3
  sample.bluetooth.periodic_sync.renode:
    # Built for the multi-node Renode tests in tests/renode/bluetooth/samples
    build_only: true
    platform_allow:
      - xg24_rb4186c
      - xg26_rb4118a
    tags: bluetooth

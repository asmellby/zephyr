identifier: xg26_rb4118a
name: EFR32xG26 2.4 GHz +10 dBm BGA136 Radio Board (xG26-RB4118A, BRD4118A)
type: mcu
arch: arm
ram: 512
flash: 3200
simulation:
  - name: renode
    exec: renode
toolchain:
